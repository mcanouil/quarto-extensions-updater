name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

# A release bumps a version, pushes a branch, and creates a tag, so two at once
# would race over all three. Queue rather than cancel: a cancelled release
# leaves the bump branch and its pull request behind.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A push made with the default token triggers no workflow, which leaves
      # the bump pull request without the checks its auto-merge waits for.
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The pins in the examples follow the major, so a major release rewrites
      # them. Most documentation pages hold no pin, hence required: false on
      # the globs. The rebuilt dist/ ships with the version that names it.
      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version }}
          tag-prefix: v
          token: ${{ steps.token.outputs.token }}
          ecosystems: npm, citation
          targets: |
            - file: README.md
              pattern: 'mcanouil/quarto-extensions-updater@v{major}'
            - file: .github/DISCUSSION_TEMPLATE/q-a.yml
              pattern: 'mcanouil/quarto-extensions-updater@v{major}'
            - file: docs/*.qmd
              pattern: 'mcanouil/quarto-extensions-updater@v{major}'
              required: false
            - file: docs/*/*.qmd
              pattern: 'mcanouil/quarto-extensions-updater@v{major}'
              required: false
          after-bump: npm run build

      - name: Land the bump
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: v
          message: "ci: bump version for release :rocket:"
          branch: ci/bump-version
          token: ${{ steps.token.outputs.token }}

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          section-heading: ""

      - name: Release on GitHub
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          tag-prefix: v
          body-file: ${{ steps.notes.outputs.body-file }}
          target: ${{ steps.land.outputs.sha }}
          rolling: true
          token: ${{ steps.token.outputs.token }}
