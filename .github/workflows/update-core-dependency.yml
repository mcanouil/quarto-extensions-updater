name: Update @quarto-wizard/core Dependency

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g., 2.1.0 or 'latest')"
        required: false
        default: "latest"
        type: string
  # repository_dispatch:
  #   types: [quarto-wizard-core-release]

# Quarto-Wizard core release trigger step
# - name: Trigger dependency update in quarto-extensions-updater
#   env:
#     GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
#     VERSION: ${{ env.VERSION }}
#   run: |
#     curl -X POST \
#       -H "Accept: application/vnd.github+json" \
#       -H "Authorization: Bearer ${GH_TOKEN}" \
#       https://api.github.com/repos/mcanouil/quarto-extensions-updater/dispatches \
#       -d "{\"event_type\":\"quarto-wizard-core-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}"

permissions:
  contents: read

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A pull request opened with the default token triggers no workflow, so
      # its tests would never run.
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Set version
        id: version
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            VERSION="${PAYLOAD_VERSION}"
          else
            VERSION="${INPUT_VERSION}"
          fi

          # Resolve "latest" to actual version tag
          if [ "${VERSION}" = "latest" ]; then
            VERSION=$(gh api repos/mcanouil/quarto-wizard/releases/latest --jq '.tag_name')
            echo "Resolved 'latest' to version: ${VERSION}"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Updating to version: ${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Update package.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i 's|"@quarto-wizard/core": "https://github.com/mcanouil/quarto-wizard/releases/download/[^"]*"|"@quarto-wizard/core": "https://github.com/mcanouil/quarto-wizard/releases/download/'"${VERSION}"'/quarto-wizard-core-'"${VERSION}"'.tgz"|' package.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build action
        run: npm run build

      - name: Open the pull request
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          merge: none
          files: |
            package.json
            package-lock.json
            dist
          message: "chore(deps): update @quarto-wizard/core to ${{ steps.version.outputs.version }}"
          branch: chore/update-quarto-wizard-core
          body: |
            Updates `@quarto-wizard/core` to ${{ steps.version.outputs.version }}.

            Release notes: https://github.com/mcanouil/quarto-wizard/releases/tag/${{ steps.version.outputs.version }}
          token: ${{ steps.token.outputs.token }}
